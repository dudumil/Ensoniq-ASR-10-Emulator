# Builds the app and the VST3 plug-in for macOS (Apple Silicon) on a GitHub runner.
# The files are under "Artifacts" on the run's page.
name: macOS
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build-mac.sh --no-install
      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent ASR-10.app ASR-10-app.zip
          ditto -c -k --keepParent ASR10.vst3 ASR10-vst3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ASR10-macOS
          path: |
            dist/ASR-10-app.zip
            dist/ASR10-vst3.zip
            dist/asr10-cli
