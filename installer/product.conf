# Names used by the packaging scripts (installer/mac/make-pkg.sh, installer/windows/make-setup.sh)
PRODUCT="ASR-10 Emulator"             # display name (Start menu, Applications folder, uninstall list)
SHORT=ASR10                           # plug-in bundles: ASR10.vst3, ASR10.component
APP="ASR-10.app"                      # macOS app
EXE=asr10                             # asr10.exe / asr10-cli(.exe)
ID=org.asr10emu                       # macOS package identifiers
ZIPBASE=ASR10-Emulator                # file names of the packages
CFGDIR=ASR10emu                       # per-user settings folder (Ensoniq/ASR10emu)
DATA_DIRS="roms scsi"                 # folders next to the program that the user writes to
